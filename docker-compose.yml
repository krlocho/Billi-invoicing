services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: billi
      POSTGRES_PASSWORD: billi
      POSTGRES_DB: billi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - upload_data:/app/uploads
    env_file:
      - .env
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A src.celery_app:celery worker --loglevel=info
    volumes:
      - .:/app
      - upload_data:/app/uploads
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  upload_data:
